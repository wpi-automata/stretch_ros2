mapping_node:
  ros__parameters:
    # Exploration behavior
    exploration_timeout_s: 300.0    # max seconds to explore
    max_scan_drive_cycles: 20       # max head-scan + drive cycles

    # Environment
    use_sim: false

exploration_node:
  ros__parameters:
    exploration_mode: "funmap"      # funmap | occupancy_grid | simple
    exploration_timeout_s: 300.0
    max_scan_drive_cycles: 20
    use_sim: false

    # simple mode
    n_positions: 4
    move_distance: 0.8

    # Scene graph context
    room_type: "kitchen"
    query: ""
