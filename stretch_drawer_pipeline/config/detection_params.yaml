drawer_detection_node:
  ros__parameters:
    # Detic detection threshold for drawer class
    detection_confidence: 0.5

    # De-duplication: merge detections whose handle positions are within this distance
    enable_dedup: true
    dedup_distance_m: 0.1

    # Stretch3 reachability limits (gripper Z in map frame)
    max_reach_height: 1.4       # meters (above floor)
    min_reach_height: 0.1       # meters (above floor)
    max_reach_distance: 0.6     # max arm extension

    # Detection rate (Hz) — how often to run detection on incoming frames
    detection_rate_hz: 2.0

    # Test mode: robot does a spiral pattern instead of relying on mapping node
    test_mode: false

    # GNN ranking match threshold (meters) for spatial matching
    gnn_match_threshold: 0.5

    # Ranking mode: "scene_graph", "clip_text_text", or "clip_image_text"
    rank_type: "scene_graph"

    # CLIP cosine similarity threshold to declare the query object found
    found_threshold: 0.8

    # Environment
    use_sim: false
